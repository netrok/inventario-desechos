; Overrides para inventario-desechos.
; StoreItemRequest/UpdateItemRequest validan foto/evidencia hasta 4096 KB
; (ver app/Http/Requests/*ItemRequest.php e ItemController::changeEstado);
; se deja margen arriba de ese límite para no chocar con multipart overhead.
upload_max_filesize = 10M
post_max_size = 12M

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

date.timezone = America/Mexico_City

; Locale es_MX vía APP_LOCALE=es en .env (Laravel), no depende de php.ini.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; En dev conviene detectar cambios de archivo sin reiniciar el contenedor.
; En el servidor real (docs/DEPLOY.md, config:cache) pon esto en 0 y
; recarga php-fpm tras cada deploy.
opcache.validate_timestamps = 1

; expose_php off por higiene, aunque las cabeceras de seguridad de la app
; (App\Http\Middleware\SecurityHeaders) no dependen de esto.
expose_php = Off
