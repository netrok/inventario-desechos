server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Debe ser >= post_max_size de docker/php/php.ini.
    client_max_body_size 12M;

    access_log /var/log/nginx/inventario-access.log;
    error_log  /var/log/nginx/inventario-error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60;
    }

    # Fotos/evidencias servidas vía storage:link (docs/DEPLOY.md: "Photos/
    # evidencias servidas solo desde public/storage").
    location /storage/ {
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
